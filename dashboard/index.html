<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>사이 Team Health — 예시 데이터</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 🔴 폰트는 소개 사이트(site/index.html)와 같은 방식으로 읽는다 — base64로 심지 않는다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // 첫 페인트 전에 테마를 정한다 — 깜빡임 방지. 저장한 값이 없으면 시스템 설정을 따른다.
      try {
        var t = localStorage.getItem('sai-dashboard-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- 화면 뼈대는 확장 대시보드와 같은 한 벌이다 — src/dashboard/seam/markup.js. 이 페이지는 예시 데이터 전용. -->
    <div id="seam"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
