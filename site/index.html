<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이 — 해외 동료와 주고받는 업무 메시지</title>
    <meta
      name="description"
      content="사이는 해외 동료에게 보낼 업무 메시지를 다듬고, 받은 메시지의 실제 의도를 풀어 주는 크롬 확장 프로그램입니다. 메시지 본문은 사이 서버에 저장하지 않습니다."
    />
    <!-- 공유 미리보기(2026-11-03 출시 글용). 이미지는 스토어 스크린샷 1번 사본 — 장면을 바꾸면 같이 바꾼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="사이" />
    <meta property="og:title" content="사이 — 해외 동료와 주고받는 업무 메시지" />
    <meta property="og:description" content="보내기 전에 상대 언어와 긴급도에 맞게 다듬고, 받은 메시지는 속뜻까지 풀어 주는 크롬 확장. 메시지 본문은 저장하지 않아요." />
    <meta property="og:url" content="https://sai-global-msg-2026.web.app/" />
    <meta property="og:image" content="https://sai-global-msg-2026.web.app/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // 옛 확장(0.1.17 이하)은 팀 대시보드를 첫 화면 주소 + `#sai=…`로 연다 — /dashboard/(예시)로 넘긴다.
      // 🔴 0.1.21 — 주소의 팀 데이터는 넘기지 않고 버린다. 실제 팀 지표는 확장 안 대시보드에서만 본다.
      if (location.pathname === '/' && location.hash.indexOf('#sai=') === 0) {
        location.replace('/dashboard/');
      }
    </script>
    <script>
      // 첫 페인트 전에 테마를 정한다 — 깜빡임 방지. 저장소가 막혀 있으면 시스템 설정을 따른다.
      try {
        var t = localStorage.getItem('sai-site-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
