# 🔴 로컬 workerd 확인 전용 — 배포 금지(`dev/dev-entry.js` 헤더 참조). 실행: `npm run dev:mock`
# 운영 설정은 `wrangler.toml`. 여기 값은 전부 지어낸 것이다(실제 키 아님 — 가짜 fetch가 받으므로 쓰이지 않는다).
name = "sai-refine-dev"
main = "dev/dev-entry.js"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# 🔴 운영(`wrangler.toml`)과 같은 SDK 대역 — 로컬 workerd에서도 배포본과 같은 코드가 돈다(2026-10-23 L33).
[alias]
"@anthropic-ai/sdk" = "./src/anthropicFetch.js"
# 🔴 2026-10-26 — functions/*.js 판정 코드를 Worker에서 그대로 부른다. firebase-admin 대신 REST 어댑터의 FieldValue를 받게 한다
#    (src/shims/*.js 헤더). test/sdkAlias.mjs에도 같은 표가 있다 — 하나만 바꾸면 테스트와 배포본이 갈린다.
"firebase-admin/firestore" = "./src/shims/firebaseAdminFirestore.js"
"firebase-admin/auth" = "./src/shims/firebaseAdminAuth.js"

[vars]
FIREBASE_PROJECT_ID = "sai-global-msg-2026"
EXTENSION_ID = "ogbcccaaojphhgobeeidpafokjieckdf"
ANTHROPIC_API_KEY = "dev-fake-key-not-real"
# 🔴 GROQ_API_KEY는 넣지 않는다 — 가짜 fetch는 Anthropic만 흉내 내므로, 넣으면 폴오버가 실제 api.groq.com을 부른다.
