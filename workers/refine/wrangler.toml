# 사이(Sai) 교정 Worker — 🔴 1단계 시험판(L33). 배포하지 않았다 — 배포는 사용자 Cloudflare 계정·승인 후.
#
# 🔴 비밀값을 이 파일에 쓰지 않는다. provider 키는 Worker 시크릿으로만 넣는다(2026-10-23 — 사슬 anthropic → groq):
#      npx wrangler secret put ANTHROPIC_API_KEY      (1번 — 기본)
#      npx wrangler secret put GROQ_API_KEY           (2번 — 폴오버. 없으면 그 단계는 건너뛴다)
#    (사용자가 직접 입력 — 대화·로그에 남기지 않는다. Gemini는 사슬 밖이라 안내하지 않는다 — 사용자 결정 (b))
#    🔴 2026-10-26 — 일일 상한·베타 지표·팀 API(/v1/team)는 서비스 계정이 있어야 돈다(`src/google/clients.js`):
#      PowerShell:  Get-Content <서비스계정.json> -Raw | npx wrangler secret put GOOGLE_SERVICE_ACCOUNT
#    서비스 계정 역할: Cloud Datastore 사용자 + Firebase 인증 관리자(계정 삭제). 없으면 /health usageStore=noop·team=unavailable.
#    CLAUDE.md의 Firebase 함정(숨김 프롬프트 붙여넣기 실패·끝 개행 → 401 오진)이 여기서도 생길 수 있다 —
#    401이 나면 코드보다 먼저 시크릿 값을 의심한다(🔴 추정, 미실측).
#
# 🔴 계정 ID는 비밀이 아니다(대시보드 URL에 보이는 값 — 인증은 `wrangler login` 토큰이 한다). 2026-10-23 사용자 제공.
account_id = "d4228d17e6de7e2372fecbd9b5580f86"

name = "sai-refine"
main = "src/index.js"
# 🔴 설치된 workerd(1.20261019.1)가 지원하는 날짜 이하여야 한다 — 더 새 날짜면 wrangler가 경고하고 내려 잡는다.
compatibility_date = "2026-10-15"
# 🔴 nodejs_compat는 **꼭 필요해서** 켠다(2026-10-23 확인):
#    ① 공유 코어 `src/core/refine/cache.js`가 `import { createHash } from 'node:crypto'`를 정적으로 부른다
#       — 이 플래그 없이는 번들이 로드조차 안 된다. 코어를 고치지 않으려고 플래그 쪽을 택했다.
#    ② (2026-10-24 #42부터 해당 없음) 사고 스위치는 `src/handler.js` `thinkingSwitch`가 env 값을 코어에 직접
#       넘긴다 — Worker는 요청 중 `process`를 읽지 않는다(`test/handler.test.js`가 잠근다).
compatibility_flags = ["nodejs_compat"]

# 🔴 Anthropic SDK를 번들에서 뺀다(2026-10-23 L33 — 콜드 cpuTime 34ms·30ms > 무료 한도 10ms 대응, 선택지 A).
#    코어 `providers/anthropic.js`의 `import('@anthropic-ai/sdk')`가 이 대역(fetch 한 번)으로 바뀐다 — 코어 코드는 그대로.
#    Node 경로(프록시·Functions·회귀 러너)는 영향 없음. 대역이 흉내 내는 표면·이유는 `src/anthropicFetch.js` 헤더.
#    🔴 이 줄을 지우면 SDK가 다시 번들된다 — `npm run check:bundle`이 잡는다. `wrangler.dev.toml`에도 같은 줄이 있다.
[alias]
"@anthropic-ai/sdk" = "./src/anthropicFetch.js"
# 🔴 2026-10-26 — functions/*.js 판정 코드를 Worker에서 그대로 부른다. firebase-admin 대신 REST 어댑터의 FieldValue를 받게 한다
#    (src/shims/*.js 헤더). test/sdkAlias.mjs에도 같은 표가 있다 — 하나만 바꾸면 테스트와 배포본이 갈린다.
"firebase-admin/firestore" = "./src/shims/firebaseAdminFirestore.js"
"firebase-admin/auth" = "./src/shims/firebaseAdminAuth.js"

# 🔴 공개 설정값만(비밀 아님). 로직에 하드코딩하지 않고 여기서 읽는다(`src/config.js`).
[vars]
FIREBASE_PROJECT_ID = "sai-global-msg-2026"
# `src/manifest.js`의 `key`가 고정한 확장 ID — `functions/index.js` `EXTENSION_ID`와 같은 값이어야 한다.
EXTENSION_ID = "gdipbmakeghjecpenebjlfhgcajbikkg"
# 사고(thinking) — 2026-10-23부터 코어 기본이 **끔**이라 적지 않는다(L30 실측: 끔 건당 $0.00070·중앙값 2.4~2.5초 /
# 켬 $0.00107·6.2~6.7초). 실험으로 켤 때만:
# SAI_ANTHROPIC_THINKING = "adaptive"
# 비우면 코어 기본값(`claude-haiku-5-5`).
# ANTHROPIC_MODEL = "claude-haiku-5-5"

# 🔴 관측 — `wrangler tail`·대시보드에서 요청별 cpuTime을 보려면 켠다. 로그에는 본문이 없다(Spec 필수 5).
[observability]
enabled = true
