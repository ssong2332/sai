# 사이(Sai) 교정 Worker — 🔴 1단계 시험판(L33). 배포하지 않았다 — 배포는 사용자 Cloudflare 계정·승인 후.
#
# 🔴 비밀값을 이 파일에 쓰지 않는다. `ANTHROPIC_API_KEY`는 Worker 시크릿으로만 넣는다:
#      npx wrangler secret put ANTHROPIC_API_KEY      (사용자가 직접 입력 — 대화·로그에 남기지 않는다)
#    CLAUDE.md의 Firebase 함정(숨김 프롬프트 붙여넣기 실패·끝 개행 → 401 오진)이 여기서도 생길 수 있다 —
#    401이 나면 코드보다 먼저 시크릿 값을 의심한다(🔴 추정, 미실측).
#
# 🔴 계정 ID는 자리표시자다. `wrangler login` 후 `wrangler whoami`로 확인해 넣는다(사용자 작업).
# account_id = "<CLOUDFLARE_ACCOUNT_ID>"

name = "sai-refine"
main = "src/index.js"
# 🔴 설치된 workerd(1.20261019.1)가 지원하는 날짜 이하여야 한다 — 더 새 날짜면 wrangler가 경고하고 내려 잡는다.
compatibility_date = "2026-10-15"
# 🔴 nodejs_compat는 **꼭 필요해서** 켠다(2026-10-23 확인):
#    ① 공유 코어 `src/core/refine/cache.js`가 `import { createHash } from 'node:crypto'`를 정적으로 부른다
#       — 이 플래그 없이는 번들이 로드조차 안 된다. 코어를 고치지 않으려고 플래그 쪽을 택했다.
#    ② `providers/anthropic.js`의 사고 끄기 스위치가 `process.env.SAI_ANTHROPIC_THINKING`을 읽는다
#       (Worker에서는 `src/handler.js` `applyThinkingSwitch`가 env 값을 거기에 옮겨 준다).
compatibility_flags = ["nodejs_compat"]

# 🔴 공개 설정값만(비밀 아님). 로직에 하드코딩하지 않고 여기서 읽는다(`src/config.js`).
[vars]
FIREBASE_PROJECT_ID = "sai-global-msg-2026"
# `src/manifest.js`의 `key`가 고정한 확장 ID — `functions/index.js` `EXTENSION_ID`와 같은 값이어야 한다.
EXTENSION_ID = "ogbcccaaojphhgobeeidpafokjieckdf"
# L30 실측: 사고 끔 건당 $0.00070·중앙값 2.4~2.5초 / 켬 $0.00107·6.2~6.7초. 시험판은 끔으로 둔다.
SAI_ANTHROPIC_THINKING = "disabled"
# 비우면 코어 기본값(`claude-haiku-5-5`).
# ANTHROPIC_MODEL = "claude-haiku-5-5"

# 🔴 관측 — `wrangler tail`·대시보드에서 요청별 cpuTime을 보려면 켠다. 로그에는 본문이 없다(Spec 필수 5).
[observability]
enabled = true
