<!doctype html>
<!--
  홍보 영상 ③ 「도형 하나 무한 반복」 9:16 · 14초 (2026-11-03).
  참고: awesome-opus5-5-videos 「UI Motion Loop Design」(@flxrnc) — 도형 하나, 컷 없음, 상태에서 상태로 바뀔 뿐 교체되지 않는다.
  닫힌 꼴 스프링(감쇠비 0.72 · 0.35초 안착), 카메라는 박에 맞춰 시작해 도형보다 늦게 안착. 14초 끝 화면 = 0초 화면(이음매 없음).
  색(16진): 바탕 #0b0d12 · 도형 #f04419 · 글자 #ffffff · 보조 #8b95a1. 글꼴 Pretendard. 박자 120bpm — 상태마다 4박(2초).
  🔴 글은 실제 사이 결과·기능만(다듬은 영어 = 2026-11-03 실 API 첫 문장, 08:24 = 실브라우저 시계, 배포→deploy = 팀 용어 예시).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url(../../../public/fonts/Pretendard-SemiBold.subset.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: P; src: url(../../../public/fonts/Pretendard-Bold.subset.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: P; src: url(../../../public/fonts/Pretendard-ExtraBold.subset.woff2) format('woff2'); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d12; }
  body { font-family: P, sans-serif; word-break: keep-all; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 46%; }
  #shape { position: absolute; background: #f04419; display: grid; place-items: center; overflow: hidden; }
  .in { text-align: center; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; will-change: transform, opacity; }
  .cap { position: absolute; left: 0; right: 0; top: 1420px; text-align: center; overflow: hidden; height: 90px; }
  .cap span { display: block; font-size: 60px; font-weight: 800; letter-spacing: -0.03em; }
  .sub { font-size: 34px; font-weight: 700; color: rgba(255,255,255,.75); letter-spacing: 0; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="cam">
  <div id="shape"><div class="in" id="inner"></div></div>
  <div class="cap"><span id="cap"></span></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const out3 = (p) => 1 - Math.pow(1 - clamp(p), 3);
  // 닫힌 꼴 감쇠 스프링 — 0에서 1로(살짝 넘었다 돌아온다)
  const spring = (t, zeta, settle) => {
    if (t <= 0) return 0;
    const w = 4 / (zeta * settle), wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(wd * t));
  };
  const CY = 860; // 도형 중심 y
  // 상태: 폭·높이·모서리(왼위,오위,오아래,왼아래)·안 글·아래 글
  const S = [
    { w: 620, h: 84, r: [42, 42, 42, 42], html: '', cap: '사이 · 크롬 확장' },
    { w: 780, h: 340, r: [64, 64, 64, 14], html: '<div style="font-size:72px">이거 빨리<br>해주세요.</div>', cap: '보내기 전에,' },
    { w: 940, h: 420, r: [64, 64, 14, 64], html: '<div style="font-size:56px;line-height:1.22">Could you please look<br>into this as soon<br>as possible?</div>', cap: '상대 언어로.' },
    { w: 560, h: 560, r: [280, 280, 280, 280], html: '<span class="sub">Berlin</span><div style="font-size:150px;letter-spacing:-0.05em">08:24</div>', cap: '상대 시간까지.' },
    { w: 780, h: 480, r: [48, 48, 48, 48], html: '<span class="sub">팀 용어집</span><div style="font-size:96px">배포 → deploy</div>', cap: '팀이 정한 단어로.' },
    { w: 540, h: 640, r: [270, 270, 90, 90], html: '<div style="font-size:84px">본문<br>저장<br>안 함</div>', cap: '메시지는 남기지 않아요.' },
  ];
  const SEQ = [0, 1, 2, 3, 4, 5, 0]; // 0~12초 상태 6번, 12~14초 다시 막대(=0초 화면)
  const STEP = 2;
  const CAM = [[1, 0], [1.04, -20], [1, 0], [1.05, 10], [1.02, -10], [1.04, 0], [1, 0]];

  window.render = (t) => {
    t = ((t % 14) + 14) % 14;
    const i = Math.min(SEQ.length - 1, Math.floor(t / STEP));
    const local = t - i * STEP;
    const from = S[SEQ[Math.max(0, i - 1)]], to = S[SEQ[i]];
    const p = i === 0 ? 1 : spring(local, 0.72, 0.35);
    const L = (a, b) => a + (b - a) * p;
    const w = L(from.w, to.w), h = L(from.h, to.h);
    Object.assign($('shape').style, {
      left: `${540 - w / 2}px`, top: `${CY - h / 2}px`, width: `${w}px`, height: `${h}px`,
      borderRadius: to.r.map((r, k) => `${Math.max(0, L(from.r[k], r))}px`).join(' '),
    });
    // 안 글: 바뀌는 순간 옛 글은 0.12초 안에 줄며 사라지고, 새 글은 0.15초 뒤 올라온다
    const showNew = i === 0 || local >= 0.12;
    const html = showNew ? to.html : from.html;
    if ($('inner').innerHTML !== html) $('inner').innerHTML = html;
    if (!showNew) { const q = local / 0.12; Object.assign($('inner').style, { opacity: 1 - q, transform: `scale(${1 - 0.2 * q})` }); }
    else { const q = i === 0 ? 1 : out3((local - 0.15) / 0.35); Object.assign($('inner').style, { opacity: clamp(q * 1.5), transform: `translateY(${(1 - q) * 40}px)` }); }
    // 아래 글 — 마스크 선에서 올라온다. 마지막 막대는 0초와 같게(이음매)
    const cap = to.cap;
    if ($('cap').textContent !== cap) $('cap').textContent = cap;
    const cq = i === 0 || i === SEQ.length - 1 && local > 1.5 ? 1 : out3((local - 0.2) / 0.4);
    const capOut = i < SEQ.length - 1 && local > STEP - 0.15 ? out3((local - (STEP - 0.15)) / 0.15) : 0;
    $('cap').style.transform = `translateY(${(1 - cq) * 110 - capOut * 110}%)`;
    // 카메라 — 박에 맞춰 시작, 도형보다 늦게(0.7초) 안착
    const cp = i === 0 ? 1 : spring(local, 0.9, 0.7);
    const [z0, y0] = CAM[Math.max(0, i - 1)], [z1, y1] = CAM[i];
    $('cam').style.transform = `translateY(${y0 + (y1 - y0) * cp}px) scale(${z0 + (z1 - z0) * cp})`;
  };
  const q = new URLSearchParams(location.search).get('t');
  window.render(q === null ? 0 : Number(q));
</script>
</body>
</html>
