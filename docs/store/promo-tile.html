<!doctype html>
<!--
  Chrome 웹 스토어 작은 프로모션 타일 440×280 (L21, 2026-10-29).
  렌더: docs/store/README.md 의 명령으로 promo-small-440x280.png 를 만든다.
  색·글꼴: src/styles/tokens.css (A2) · public/fonts Pretendard. 로고: src/assets/SaiMark.jsx 좌표 그대로.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url(../../public/fonts/Pretendard-Regular.subset.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: P; src: url(../../public/fonts/Pretendard-SemiBold.subset.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: P; src: url(../../public/fonts/Pretendard-Bold.subset.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: P; src: url(../../public/fonts/Pretendard-ExtraBold.subset.woff2) format('woff2'); font-weight: 800; }
  :root { --ink: #191f28; --sub: #4e5968; --bg: #f2f4f6; --seam: #f04419; --dusk: #3d5afe; --line: #e5e8eb; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: #fff; font-family: P, sans-serif; color: var(--ink); position: relative; }
  .left { position: absolute; left: 32px; top: 36px; width: 196px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 44px; height: 22px; }
  .word { font-weight: 800; font-size: 22px; letter-spacing: 0.02em; }
  h1 { margin: 34px 0 0; font-weight: 800; font-size: 30px; line-height: 1.22; letter-spacing: -0.02em; }
  p { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--sub); }
  .right { position: absolute; right: 0; top: 0; width: 196px; height: 280px; background: var(--bg); }
  .msg { position: absolute; box-sizing: border-box; border-radius: 12px; font-size: 12.5px; line-height: 1.35; padding: 10px 12px; width: 156px; }
  .before { top: 46px; left: 28px; background: #fff; color: var(--sub); border: 1px solid var(--line); }
  .after { top: 158px; left: 14px; background: var(--ink); color: #fff; font-weight: 600; }
  .tag { display: block; font-size: 10.5px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.02em; }
  .before .tag { color: #8b95a1; }
  .after .tag { color: #8c9eff; }
  .seam { position: absolute; left: 14px; top: 140px; width: 170px; height: 4px; background: var(--seam); border-radius: 2px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 188 96" aria-hidden="true">
        <rect x="14" y="20" width="118" height="16" fill="#191f28"/>
        <rect x="56" y="44" width="118" height="16" fill="#191f28"/>
        <rect x="14" y="68" width="160" height="16" fill="#f04419"/>
      </svg>
      <span class="word">S·AI</span>
    </div>
    <h1>보내기 전에,<br>한 번 더.</h1>
    <p>해외 동료에게 보내는<br>업무 메시지 다듬기</p>
  </div>
  <div class="right">
    <div class="msg before"><span class="tag">보낼 글</span>이거 오늘까지 꼭 확인 좀 해 주세요</div>
    <div class="seam"></div>
    <div class="msg after"><span class="tag">다듬은 글</span>Could you review this by end of day?</div>
  </div>
</body>
</html>
